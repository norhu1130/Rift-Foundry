[project]
name = "rift-foundry"
version = "0.1.0"
description = "Rift Foundry — patch-locked offline League of Legends build recommendation engine"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.25,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lol_build"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

